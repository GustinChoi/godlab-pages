<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="GODLab 공식 페이지">
  <title>GODLab</title>
  <style>
    :root{--ink:#161616;--muted:#666;--line:#e9e9e9;--accent:#18b8a5;--bg:#fbfbfa}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    main{min-height:100vh;display:grid;place-items:center;padding:32px}.card{width:min(760px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(32px,7vw,72px);box-shadow:0 18px 60px rgba(0,0,0,.05)}
    .mark{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em}.dot{width:12px;height:12px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
    h1{font-size:clamp(42px,8vw,76px);margin:36px 0 12px;letter-spacing:-.055em}p{font-size:18px;line-height:1.8;color:var(--muted);margin:0 0 34px}
    a{display:inline-block;text-decoration:none;color:#fff;background:var(--ink);padding:14px 20px;border-radius:12px;font-weight:700}a:hover{background:var(--accent)}
    footer{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:#888}
  </style>
</head>

</html>
